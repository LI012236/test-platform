server:
  port: 18092

spring:
  application:
    name: test-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/test_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: "123456"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always

logging:
  level:
    root: info
    com.example.testplatform: debug
